services:
  restic:
    build: .
    container_name: backup-restic
    hostname: backup-restic
    restart: unless-stopped
    environment:
      RESTIC_REPOSITORY: /repository
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      BACKUP_TIME_UTC: ${BACKUP_TIME_UTC:-00:00}
    volumes:
      - ./data:/repository
      - ./recover:/recover
      - ./conf:/conf:ro
      - /opt:/opt:ro
